name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Test
        shell: pwsh
        run: |
          cd cli; go test -count=1 ./...
          cd ../panel; go test -count=1 ./...

      - name: Build
        shell: pwsh
        run: |
          cd cli; go build ./...
          cd ../panel; go build ./...
