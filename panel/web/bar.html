<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AgentAwake bar</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #1c1c1c;          /* 运行时由 Go 传入任务栏底色覆盖 */
    overflow: hidden;
    font: 12.5px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, "Microsoft YaHei UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }
  body { display: flex; align-items: center; justify-content: center; }
  /* 深色胶囊：比任务栏略亮；无任何阴影（只有背景渐变） */
  .pill {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: auto;              /* 由 JS 按窗口宽度减去两侧留白设置 */
    height: 26px;
    padding: 0 12px;
    box-sizing: border-box;
    border-radius: 15px;
    background:
      linear-gradient(180deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.065) 46%,
        rgba(255, 255, 255, 0.04) 100%),
      #2b2f37;
    transition: opacity 160ms ease;
  }
  /* 保持中：整块胶囊泛绿并快速呼吸（绿色=运行中） */
  .pill.on {
    background:
      linear-gradient(180deg,
        rgba(127, 201, 155, 0.55) 0%,
        rgba(127, 201, 155, 0.40) 52%,
        rgba(127, 201, 155, 0.30) 100%),
      #24382b;
    animation: capsule-breathe 1.5s ease-in-out infinite;
  }
  @keyframes capsule-breathe {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.45); }
  }
  .dot { font-size: 8px; line-height: 1; }
  .dot.idle { color: #9AA0A6; }
  .dot.on { color: #7FC99B; }
  .dot.err { color: #D4796F; }
  .label { color: #E8EAED; font-weight: 500; }
  .count { color: #A9AFB7; }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <span class="dot idle" id="dot">●</span>
    <span class="label" id="label">空闲</span>
    <span class="count" id="count">租约 0</span>
  </div>
  <script src="bar.js"></script>
</body>
</html>
